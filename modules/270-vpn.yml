name: vpn
type: apt
sources:
  - packages:
    - wireguard
    - wireguard-tools
    - openvpn
    - openconnect
    - strongswan
    - xl2tpd
    - network-manager-openvpn
    - network-manager-openconnect
    - network-manager-l2tp
    - network-manager-strongswan
    - network-manager-vpnc
    - network-manager-pptp
    - network-manager-sstp
    - plasma-nm
    - libayatana-appindicator3-1
    # wireguird depende de resolvconf; openresolv satisfaz sem assumir o /etc/resolv.conf
    - openresolv
modules:
  # GUI WireGuard (wireguird)
  - name: wireguird
    type: shell
    sources:
      - type: file
        url: https://github.com/UnnoTed/wireguird/releases/download/v1.1.0/wireguird_amd64.deb
        checksum: b193621139b8f843062d964d2cb2f6b71d4de05bad5f9e457e88f6fd68d09ccc
        only-arches: [amd64]
    commands:
      # submodulos rodam antes do pai: garante openresolv antes do wireguird
      - apt-get install -y openresolv /sources/wireguird/*/*.deb

  # Mullvad VPN (pacote oficial; instala em /opt, realocado em 990-relocate-opt)
  - name: mullvad-vpn
    type: shell
    commands:
      - curl -fsSLo /usr/share/keyrings/mullvad-keyring.asc https://repository.mullvad.net/deb/mullvad-keyring.asc
      - echo "deb [signed-by=/usr/share/keyrings/mullvad-keyring.asc arch=amd64] https://repository.mullvad.net/deb/stable stable main" > /etc/apt/sources.list.d/mullvad.list
      - apt-get update
      - apt-get install -y mullvad-vpn || dpkg --configure -a
      - dpkg -s mullvad-vpn
